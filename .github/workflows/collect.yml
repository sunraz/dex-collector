name: dex-collector-and-detector
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # backup trigger, GitHub may skip it
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: collector
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python collector.py
      - run: python detector.py
      - name: commit data
        run: |
          git config user.name "dex-collector"
          git config user.email "dex-collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)"
          git pull --rebase -q || true
          git push
  next:
    # Self-chaining loop: wait ~14 min then dispatch this same workflow again, so it does not depend on GitHub cron.
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: wait then re-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 840
          gh workflow run collect.yml --repo "${{ github.repository }}" --ref main
