name: dex-collector-and-detector
on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (GitHub's minimum reliable interval)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collector
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python collector.py
      - run: python detector.py
      - name: commit data
        run: |
          git config user.name "dex-collector"
          git config user.email "dex-collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)"
          git pull --rebase -q || true
          git push
